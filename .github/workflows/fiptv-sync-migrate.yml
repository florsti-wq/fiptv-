# fIPTV: Daten des Sync-Servers von Netlify (fipsite) nach Cloudflare (fiptv-sync) übertragen.
# Nur manuell starten. Kann gefahrlos wiederholt werden (überschreibt mit dem Netlify-Stand).
name: fIPTV Sync-Daten umziehen

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      TARGET_URL: https://fiptv-sync.florsti.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Prüfen
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::GitHub-Secrets fehlen:$missing"; exit 1; fi
      - name: Abhängigkeiten
        run: |
          (cd netlify-auth-site && npm ci --no-audit --no-fund)
          (cd sync-worker && npm install --no-audit --no-fund)
      - name: Einmal-Schlüssel setzen
        working-directory: sync-worker
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="fiptv-sync");process.stdout.write(d?d.uuid:"")})')
          test -n "$id" || { echo "::error::Erst den Sync-Server bereitstellen (Workflow „fIPTV Sync-Server (Cloudflare)“ mit deploy)"; exit 1; }
          sed -i "s/D1_DATABASE_ID/$id/" wrangler.toml
          token=$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::$token"
          echo "MIGRATE_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx wrangler secret put MIGRATE_TOKEN
          sleep 8
      - name: Daten übertragen
        working-directory: sync-worker
        run: node scripts/migrate.mjs
      - name: Einmal-Schlüssel entfernen
        if: always()
        working-directory: sync-worker
        run: |
          yes | npx wrangler secret delete MIGRATE_TOKEN || true
      - name: Prüfen
        run: |
          curl -fsS "$TARGET_URL/fiptv-health"; echo
