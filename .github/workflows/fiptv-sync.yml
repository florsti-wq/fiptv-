# fIPTV: Sync-Server auf Cloudflare Workers (unabhängig von Netlify-Credits).
# Baut dieselben Funktionen wie die Netlify-Seite „fipsite“ und stellt sie als Worker
# „fiptv-sync“ bereit; Daten liegen in Cloudflare D1, die Postgres-Datenbank bleibt dieselbe.
name: fIPTV Sync-Server (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Wirklich bereitstellen (sonst nur Probe-Bau)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "sync-worker/**"
      - "netlify-auth-site/netlify/functions/**"
      - "netlify-auth-site/index.html"
      - ".github/workflows/fiptv-sync.yml"

concurrency:
  group: fiptv-sync
  cancel-in-progress: false

jobs:
  build:
    name: Bauen und bereitstellen
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Server-Funktionen – Abhängigkeiten und Startseite
        working-directory: netlify-auth-site
        env:
          APP_ANON_KEY: ${{ secrets.APP_ANON_KEY }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/fiptv-build.mjs

      - name: Server-Funktionen – Tests
        working-directory: netlify-auth-site
        run: npm test || echo "::warning::Einige Tests der Server-Funktionen schlagen fehl (siehe Protokoll)."

      - name: Worker – Abhängigkeiten
        working-directory: sync-worker
        run: npm install --no-audit --no-fund

      - name: Probe-Bau (ohne Bereitstellung)
        working-directory: sync-worker
        run: npx wrangler deploy --dry-run --outdir dist

      - name: D1-Datenbank anlegen bzw. finden
        if: inputs.deploy == true
        working-directory: sync-worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Cloudflare-Secrets fehlen"; exit 1; fi
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="fiptv-sync");process.stdout.write(d?d.uuid:"")})')
          if [ -z "$id" ]; then
            npx wrangler d1 create fiptv-sync
            id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="fiptv-sync");process.stdout.write(d?d.uuid:"")})')
          fi
          test -n "$id"
          sed -i "s/D1_DATABASE_ID/$id/" wrangler.toml
          npx wrangler d1 execute fiptv-sync --remote --file schema.sql

      - name: Secrets übertragen
        if: inputs.deploy == true
        working-directory: sync-worker
        env:
          S_ARVIO_AUTH_SECRET: ${{ secrets.FIPTV_SYNC_AUTH_SECRET }}
          S_DATABASE_URL: ${{ secrets.FIPTV_SYNC_DATABASE_URL }}
          S_APP_ANON_KEY: ${{ secrets.APP_ANON_KEY }}
          S_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          missing=""
          [ -z "$S_ARVIO_AUTH_SECRET" ] && missing="$missing FIPTV_SYNC_AUTH_SECRET"
          [ -z "$S_DATABASE_URL" ] && missing="$missing FIPTV_SYNC_DATABASE_URL"
          if [ -n "$missing" ]; then echo "::error::GitHub-Secrets fehlen:$missing"; exit 1; fi
          node -e '
            const out = {
              ARVIO_AUTH_SECRET: process.env.S_ARVIO_AUTH_SECRET,
              DATABASE_URL: process.env.S_DATABASE_URL,
              APP_ANON_KEY: process.env.S_APP_ANON_KEY,
              TMDB_API_KEY: process.env.S_TMDB_API_KEY,
            };
            for (const k of Object.keys(out)) if (!out[k]) delete out[k];
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
          '
          # Erst bereitstellen (falls der Worker noch nicht existiert), dann Secrets setzen
          npx wrangler deploy
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Bereitstellen
        if: inputs.deploy == true
        working-directory: sync-worker
        run: npx wrangler deploy

      - name: Schnelltest
        if: inputs.deploy == true
        run: |
          sleep 5
          base="https://fiptv-sync.florsti.workers.dev"
          curl -fsS "$base/fiptv-health"; echo
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/.netlify/functions/config")
          echo "config: $code"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/")
          echo "Startseite: $code"
