# fIPTV: Sync-Server auf Cloudflare Workers (unabhängig von Netlify-Credits).
# Baut dieselben Funktionen wie die Netlify-Seite „fipsite“ und stellt sie als Worker
# „fiptv-sync“ bereit; Daten liegen in Cloudflare D1, die Postgres-Datenbank bleibt dieselbe.
name: fIPTV Sync-Server (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Wirklich bereitstellen (sonst nur Probe-Bau)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "sync-worker/**"
      - "netlify-auth-site/netlify/functions/**"
      - "netlify-auth-site/index.html"
      - ".github/workflows/fiptv-sync.yml"

concurrency:
  group: fiptv-sync
  cancel-in-progress: false

jobs:
  build:
    name: Bauen und bereitstellen
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Server-Funktionen – Abhängigkeiten und Startseite
        working-directory: netlify-auth-site
        env:
          APP_ANON_KEY: ${{ secrets.APP_ANON_KEY }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/fiptv-build.mjs

      - name: Server-Funktionen – Tests
        working-directory: netlify-auth-site
        run: npm test || echo "::warning::Einige Tests der Server-Funktionen schlagen fehl (siehe Protokoll)."

      - name: Worker – Abhängigkeiten
        working-directory: sync-worker
        run: npm install --no-audit --no-fund

      - name: Probe-Bau (ohne Bereitstellung)
        working-directory: sync-worker
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Lokaler Test (Miniflare, lokale D1, ohne Postgres)
        working-directory: sync-worker
        run: |
          printf 'ARVIO_AUTH_SECRET=test-secret-0123456789abcdef0123456789abcdef\nAPP_ANON_KEY=test-anon-key-0123456789012345678901234567890123456789\nMIGRATE_TOKEN=ci-migrate\n' > .dev.vars
          npx wrangler d1 execute fiptv-sync --local --file schema.sql
          (npx wrangler dev --local --port 8787 > ../wrangler-dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8787/fiptv-health > /dev/null && break; sleep 1; done
          echo "--- health"; curl -s http://127.0.0.1:8787/fiptv-health || { echo "Worker startet nicht:"; cat ../wrangler-dev.log; exit 1; }; echo
          echo "--- config"; curl -s -w " [%{http_code}]" http://127.0.0.1:8787/.netlify/functions/config; echo
          echo "--- Startseite"; curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8787/
          AK="test-anon-key-0123456789012345678901234567890123456789"
          echo "--- tv-auth-start"; curl -s -w " [%{http_code}]" -X POST -H "content-type: application/json" -H "apikey: $AK" -H "x-arvio-app-key: $AK" -d '{"deviceName":"CI"}' http://127.0.0.1:8787/.netlify/functions/tv-auth-start | tee start.json; echo
          echo "--- stream-ticket-key"; curl -s -w " [%{http_code}]" http://127.0.0.1:8787/.netlify/functions/stream-ticket-key | head -c 400; echo
          echo "--- auth-login (ohne Postgres, Fehler erwartet)"; curl -s -w " [%{http_code}]" -X POST -H "content-type: application/json" -H "apikey: $AK" -d '{"email":"ci@example.com","password":"x"}' http://127.0.0.1:8787/.netlify/functions/auth-login | head -c 400; echo
          node -e 'require("fs").writeFileSync("import.json", JSON.stringify({items:[{store:"account-sync",key:"ci/test.json",value:JSON.stringify({ok:true,text:"Grüße ".repeat(200000)}),metadata:{a:1}}]}))'
          echo "--- Import (großer Wert, mehrere Teile)"; curl -s -w " [%{http_code}]" -X POST -H "authorization: Bearer ci-migrate" -H "content-type: application/json" --data-binary @import.json http://127.0.0.1:8787/fiptv-admin/import; echo
          echo "--- Import ohne Schlüssel (403 erwartet)"; curl -s -o /dev/null -w "%{http_code}\n" -X POST -d '{}' http://127.0.0.1:8787/fiptv-admin/import
          echo "--- D1-Inhalt"; npx wrangler d1 execute fiptv-sync --local --command "SELECT store, key, parts FROM blobs LIMIT 20"
          echo "--- Worker-Protokoll"; tail -n 60 ../wrangler-dev.log

      - name: D1-Datenbank anlegen bzw. finden
        if: inputs.deploy == true
        working-directory: sync-worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Cloudflare-Secrets fehlen"; exit 1; fi
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="fiptv-sync");process.stdout.write(d?d.uuid:"")})')
          if [ -z "$id" ]; then
            npx wrangler d1 create fiptv-sync
            id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="fiptv-sync");process.stdout.write(d?d.uuid:"")})')
          fi
          test -n "$id"
          sed -i "s/D1_DATABASE_ID/$id/" wrangler.toml
          npx wrangler d1 execute fiptv-sync --remote --file schema.sql

      - name: Secrets übertragen
        if: inputs.deploy == true
        working-directory: sync-worker
        env:
          S_ARVIO_AUTH_SECRET: ${{ secrets.FIPTV_SYNC_AUTH_SECRET }}
          S_DATABASE_URL: ${{ secrets.FIPTV_SYNC_DATABASE_URL }}
          S_APP_ANON_KEY: ${{ secrets.APP_ANON_KEY }}
          S_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          missing=""
          [ -z "$S_ARVIO_AUTH_SECRET" ] && missing="$missing FIPTV_SYNC_AUTH_SECRET"
          [ -z "$S_DATABASE_URL" ] && missing="$missing FIPTV_SYNC_DATABASE_URL"
          if [ -n "$missing" ]; then echo "::error::GitHub-Secrets fehlen:$missing"; exit 1; fi
          node -e '
            const out = {
              ARVIO_AUTH_SECRET: process.env.S_ARVIO_AUTH_SECRET,
              DATABASE_URL: process.env.S_DATABASE_URL,
              APP_ANON_KEY: process.env.S_APP_ANON_KEY,
              TMDB_API_KEY: process.env.S_TMDB_API_KEY,
            };
            for (const k of Object.keys(out)) if (!out[k]) delete out[k];
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
          '
          # Erst bereitstellen (falls der Worker noch nicht existiert), dann Secrets setzen
          npx wrangler deploy
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Bereitstellen
        if: inputs.deploy == true
        working-directory: sync-worker
        run: npx wrangler deploy

      - name: Schnelltest
        if: inputs.deploy == true
        run: |
          sleep 5
          base="https://fiptv-sync.florsti.workers.dev"
          curl -fsS "$base/fiptv-health"; echo
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/.netlify/functions/config")
          echo "config: $code"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/")
          echo "Startseite: $code"
