# fIPTV für Windows: baut die Webapp als eigenständigen Server, packt sie in eine
# Electron-App und legt den Installer in die Freigabe „desktop-latest“ (die App
# aktualisiert sich von dort selbst). Die APK-Freigaben bleiben unberührt.
name: fIPTV Desktop bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - ".github/workflows/fiptv-desktop.yml"

concurrency:
  group: fiptv-desktop
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows-Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Webapp – Abhängigkeiten
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Webapp – als eigenständigen Server bauen
        working-directory: web
        env:
          ARVIO_STANDALONE: "true"
          APP_ANON_KEY: ${{ secrets.APP_ANON_KEY }}
          NEXT_PUBLIC_NETLIFY_BACKEND_URL: https://fipsite.netlify.app/.netlify/functions
          NETLIFY_BACKEND_URL: https://fipsite.netlify.app/.netlify/functions
          NEXT_PUBLIC_PAYWALL_ENABLED: "false"
          NEXT_PUBLIC_TELEGRAM_ENABLED: "false"
          NEXT_PUBLIC_ALLOW_NETLIFY_MEDIA_PROXY: "true"
          NEXT_PUBLIC_ARVIO_RESOLVER_URL: ""
          NEXT_TELEMETRY_DISABLED: "1"
        run: node scripts/build.mjs

      - name: Server in die App kopieren
        run: |
          rm -rf desktop/server
          cp -r web/.next/standalone desktop/server
          mkdir -p desktop/server/.next
          cp -r web/.next/static desktop/server/.next/static
          cp -r web/public desktop/server/public
          test -f desktop/server/server.js
          du -sh desktop/server

      - name: Server-Schnelltest
        working-directory: desktop/server
        run: |
          PORT=38917 HOSTNAME=127.0.0.1 NODE_ENV=production FIPTV_HOME_PROXY=true node server.js > ../server-test.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:38917/; then echo "Server antwortet"; break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:38917/ || { cat ../server-test.log; exit 1; }
          taskkill //F //IM node.exe > /dev/null 2>&1 || true

      - name: Electron – Abhängigkeiten
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Installer bauen
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version=$VERSION

      - name: Inhalt prüfen
        working-directory: desktop/dist
        run: |
          ls -la
          test -f win-unpacked/resources/server/server.js
          test -d win-unpacked/resources/server/node_modules/next
          test -d win-unpacked/resources/server/.next/static

      - name: Freigabe „desktop-latest“ aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view desktop-latest > /dev/null 2>&1; then
            gh release create desktop-latest --prerelease --latest=false \
              --title "fIPTV für Windows" \
              --notes "Installer: fIPTV-Setup.exe herunterladen und starten. Die App aktualisiert sich danach selbst."
          fi
          gh release upload desktop-latest dist/fIPTV-Setup.exe dist/fIPTV-Setup.exe.blockmap dist/latest.yml --clobber
          gh release edit desktop-latest --title "fIPTV für Windows $VERSION" \
            --notes "fIPTV $VERSION – Neu: $(git log -1 --pretty=%s). Installer: fIPTV-Setup.exe herunterladen und starten. Die App aktualisiert sich danach selbst."
        working-directory: desktop
