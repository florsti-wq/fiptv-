# fIPTV: Weiterleiter (Cloudflare Worker) für fIPTV Web bereitstellen
name: fIPTV Weiterleiter bereitstellen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "resolver-worker/**"
      - "sync-backend-url.txt"
      - ".github/workflows/fiptv-resolver.yml"

jobs:
  deploy:
    name: Worker bereitstellen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sync-Server-Adresse lesen (Datei sync-backend-url.txt, sonst bisherige)
        run: |
          url=$(grep -v '^#' sync-backend-url.txt 2>/dev/null | tr -d ' \r' | grep -m1 . || true)
          echo "FIPTV_BACKEND=$url" >> "$GITHUB_ENV"
          echo "Sync-Server: ${url:-(bisherige Adresse)}"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Abhängigkeiten
        working-directory: resolver-worker
        run: npm ci
      - name: Prüfen, ob Cloudflare-Zugang eingetragen ist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen."
            exit 1
          fi
      - name: Bereitstellen
        working-directory: resolver-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND: ${{ env.FIPTV_BACKEND }}
        run: |
          if [ -n "$BACKEND" ]; then
            npx wrangler deploy --var "STREAM_TICKET_KEYS_URL:${BACKEND%/}/stream-ticket-key"
          else
            npx wrangler deploy
          fi
