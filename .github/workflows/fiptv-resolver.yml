# fIPTV: Weiterleiter (Cloudflare Worker) für fIPTV Web bereitstellen
name: fIPTV Weiterleiter bereitstellen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "resolver-worker/**"
      - ".github/workflows/fiptv-resolver.yml"

jobs:
  deploy:
    name: Worker bereitstellen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Abhängigkeiten
        working-directory: resolver-worker
        run: npm ci
      - name: Prüfen, ob Cloudflare-Zugang eingetragen ist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen."
            exit 1
          fi
      - name: Bereitstellen
        working-directory: resolver-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
