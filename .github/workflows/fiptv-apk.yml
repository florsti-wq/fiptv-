# fIPTV: baut die APK (Fire TV, Android TV, Handy) und veröffentlicht sie als Release.
# Eigener Sync-Server: Secrets NETLIFY_BACKEND_URL + APP_ANON_KEY (Netlify-Projekt „fipsite“).
# Download für den Downloader auf dem Fire TV (immer die neueste Version):
#   https://github.com/florsti-wq/fiptv-/releases/latest/download/fiptv.apk
name: fIPTV APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "web/**"
      - "netlify-*/**"
      - "netlify.toml"
      - "supabase/**"
      - "resolver-worker/**"
      - "desktop/**"
      - "sync-worker/**"
      - ".github/workflows/fiptv-sync.yml"
      - ".github/workflows/fiptv-desktop.yml"
      - ".github/workflows/fiptv-resolver.yml"
      - ".github/workflows/fiptv-web-check.yml"
      - ".github/workflows/fiptv-probe.yml"
      - "screenshots/**"

permissions:
  contents: write

concurrency:
  group: fiptv-apk
  cancel-in-progress: true

jobs:
  apk:
    name: APK bauen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Sync-Server-Adresse lesen (Datei sync-backend-url.txt, sonst bisherige)
        run: |
          url=$(grep -v '^#' sync-backend-url.txt 2>/dev/null | tr -d ' \r' | grep -m1 . || true)
          echo "FIPTV_BACKEND=$url" >> "$GITHUB_ENV"
          echo "Sync-Server: ${url:-(bisherige Adresse)}"
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Zugangsdaten eintragen (aus den Repository-Secrets)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_ANON_KEY: ${{ secrets.APP_ANON_KEY }}
          # fIPTV: Datei sync-backend-url.txt (Cloudflare-Sync-Server) hat Vorrang
          NETLIFY_BACKEND_URL: ${{ env.FIPTV_BACKEND || secrets.NETLIFY_BACKEND_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          # Unabhängig von ARVIO: dessen Server-Adressen und öffentliche Schlüssel aus den
          # Vorgaben entfernen. Ohne eigene Secrets ist der Sync dann einfach aus.
          for k in SUPABASE_URL SUPABASE_ANON_KEY APP_ANON_KEY NETLIFY_BACKEND_URL DISCORD_CLIENT_ID SIMKL_V2_CLIENT_ID; do
            sed -i "/^$k=/d" secrets.properties
          done
          {
            # Platzhalter statt leer: leere Werte erzeugen ungültigen Java-Code in BuildConfig
            echo "SUPABASE_URL=https://supabase.invalid"
            echo "SUPABASE_ANON_KEY=your-supabase-anon-key"
            echo "APP_ANON_KEY=your-app-anon-key"
            echo "NETLIFY_BACKEND_URL=your-netlify-backend-url"
            echo "DISCORD_CLIENT_ID=your-discord-client-id"
            echo "SIMKL_V2_CLIENT_ID=your-simkl-client-id"
          } >> secrets.properties
          for k in TMDB_API_KEY SUPABASE_URL SUPABASE_ANON_KEY APP_ANON_KEY NETLIFY_BACKEND_URL GOOGLE_WEB_CLIENT_ID TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_API_KEY; do
            v="${!k}"
            # Leerzeichen, Zeilenumbrüche und Anführungszeichen vom Kopieren entfernen
            v="$(printf '%s' "$v" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//')"
            if [ -n "$v" ]; then
              sed -i "/^$k=/d" secrets.properties
              printf '%s=%s\n' "$k" "$v" >> secrets.properties
              kind=""; case "$v" in eyJ*) kind=", Token-Format";; esac
              echo "✓ $k gesetzt (${#v} Zeichen$kind)"
            else
              echo "– $k nicht gesetzt (Funktion bleibt aus)"
            fi
          done

      - name: Signaturschlüssel
        env:
          FIPTV_KEYSTORE_B64: ${{ secrets.FIPTV_KEYSTORE_B64 }}
          FIPTV_KEYSTORE_PASSWORD: ${{ secrets.FIPTV_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$FIPTV_KEYSTORE_B64" ] || [ -z "$FIPTV_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets FIPTV_KEYSTORE_B64 und FIPTV_KEYSTORE_PASSWORD fehlen. Ohne festen Schlüssel ließe sich keine neue Version über die alte installieren."
            exit 1
          fi
          echo "$FIPTV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fiptv.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/fiptv.keystore"
            echo "storePassword=$FIPTV_KEYSTORE_PASSWORD"
            echo "keyAlias=fiptv"
            echo "keyPassword=$FIPTV_KEYSTORE_PASSWORD"
          } > keystore.properties

      # ARVIO lädt beim Bauen eine große Bibliothek von GitHub-Releases nach. Die zwischenspeichern und
      # bei Zeitüberschreitungen (HTTP 504) mehrfach versuchen, statt den ganzen Build scheitern zu lassen.
      - name: Zusatzbibliothek zwischenspeichern
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-*.aar
          key: sherpa-onnx-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: sherpa-onnx-

      - name: Zusatzbibliothek laden (mit Wiederholung)
        run: |
          ver=$(grep -oP 'sherpaOnnxVersion = "\K[^"]+' app/build.gradle.kts)
          sha=$(grep -oP 'sherpaOnnxSha256 = "\K[^"]+' app/build.gradle.kts)
          f="app/libs/sherpa-onnx-$ver.aar"
          mkdir -p app/libs
          if [ -f "$f" ] && echo "$sha  $f" | sha256sum --check --status; then echo "aus dem Zwischenspeicher"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --retry 3 --retry-delay 10 -o "$f.part" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$ver/sherpa-onnx-$ver.aar" \
               && echo "$sha  $f.part" | sha256sum --check --status; then
              mv "$f.part" "$f"; echo "geladen"; exit 0
            fi
            echo "Versuch $i fehlgeschlagen, warte …"; sleep $((i*20))
          done
          echo "::error::Zusatzbibliothek sherpa-onnx konnte nicht geladen werden (GitHub-Downloads gestört?)"
          exit 1

      - name: APK bauen
        run: ./gradlew :app:assembleSideloadRelease --no-daemon --stacktrace -PfiptvBuild=${{ github.run_number }}

      - name: APK einsammeln
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/sideload/release -name '*.apk' | head -n1)
          test -n "$apk" || { echo "::error::Keine APK gefunden"; exit 1; }
          cp "$apk" fiptv.apk
          upstream=$(grep -oP 'upstreamVersionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$upstream.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          ls -lh fiptv.apk

      - name: Als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: fiptv-${{ steps.apk.outputs.version }}
          path: fiptv.apk
          retention-days: 14

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.apk.outputs.version }}"
          # Kurzer Text für das Update-Fenster der App: was ist neu?
          notes="Neu: $(git log -1 --pretty=%s)"
          gh release create "$tag" fiptv.apk --title "fIPTV $tag" --notes "$notes" --target "${{ github.sha }}" --latest
