# fIPTV: eigener Programmführer (EPG) aus iptv-org/epg – täglich neu gebaut.
# Ergebnis: https://raw.githubusercontent.com/florsti-wq/fiptv-/epg/guide.xml.gz
# Die Datei liegt im Zweig "epg", der bei jedem Lauf ersetzt wird (keine wachsende Historie).
name: fIPTV EPG bauen

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Wie viele Tage holen"
        default: "2"
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: write

concurrency:
  group: fiptv-epg
  cancel-in-progress: false

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # Reihenfolge = Vorrang bei gleichen Sendern: DE, LU, AT, FR, BE, NL, UK, US
      SITES: "web.magentatv.de tv.post.lu tvheute.at programme-tv.net telenet.tv mon-programme-tv.be tvgids.nl ziggogo.tv freeview.co.uk zap2it.com"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/epg
      - name: iptv-org/epg holen
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten
        working-directory: epg
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Senderliste bauen
        run: python3 .github/epg/build_channels.py epg fiptv.channels.xml $SITES
      - name: Programm laden
        working-directory: epg
        env:
          DAYS: ${{ github.event.inputs.days || '2' }}
        run: |
          npm run grab --- --channels=../fiptv.channels.xml --output=../out/guide.xml \
            --days=$DAYS --maxConnections=8 --timeout=30000 --gzip=../out/guide.xml.gz
      - name: Prüfen
        run: |
          ls -la out
          ch=$(grep -c "<channel " out/guide.xml || true)
          pr=$(grep -c "<programme " out/guide.xml || true)
          echo "Sender mit Daten: $ch, Sendungen: $pr"
          echo "### fIPTV EPG: $ch Sender, $pr Sendungen" >> "$GITHUB_STEP_SUMMARY"
          test "$pr" -gt 1000
      - name: Guide verschlanken (Speicher auf Fire TV)
        run: python3 .github/epg/slim_guide.py out/guide.xml out/guide.xml.gz
      - name: Gratis-Sender (iptv-org, öffentliche Streams der Sender)
        continue-on-error: true
        run: |
          mkdir -p free
          for c in de lu at ch be fr nl uk us; do
            curl -sSfL --retry 3 -o free/$c.m3u "https://iptv-org.github.io/iptv/countries/$c.m3u" || echo "fehlt: $c"
          done
          python3 .github/epg/build_free.py out/free.m3u free/de.m3u free/lu.m3u free/at.m3u free/ch.m3u free/be.m3u free/fr.m3u free/nl.m3u free/uk.m3u
          python3 .github/epg/build_free.py out/free-us.m3u free/us.m3u
          echo "### Gratis-Sender: $(grep -c '^#EXTINF' out/free.m3u) (+ USA $(grep -c '^#EXTINF' out/free-us.m3u))" >> "$GITHUB_STEP_SUMMARY"
      - name: Veröffentlichen (Zweig epg)
        run: |
          mkdir pub && cp out/guide.xml.gz pub/ && { cp out/free.m3u out/free-us.m3u pub/ 2>/dev/null || true; } && cd pub
          printf '# fIPTV EPG\n\nTäglich gebaut aus iptv-org/epg (%s).\n\nAdresse: https://raw.githubusercontent.com/%s/epg/guide.xml.gz\n' "$SITES" "$GITHUB_REPOSITORY" > README.md
          git init -q -b epg
          git config user.name "fiptv-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "EPG $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" epg
