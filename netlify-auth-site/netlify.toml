# fIPTV: eigener Sync-Server. Nur die Funktionen werden gebraucht – statt der ARVIO-Webseite
# wird lediglich die kleine Startseite dieses Ordners veröffentlicht.
[build]
  command = "node scripts/fiptv-build.mjs"
  # nur neu bauen, wenn sich der Sync-Server geändert hat
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
  publish = "public-build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions."retention-cleanup"]
  schedule = "@daily"


[[redirects]]
  from = "/delete"
  to = "/delete-account.html"
  status = 200

[[redirects]]
  from = "/account-deletion"
  to = "/delete-account.html"
  status = 200

[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 200

[[redirects]]
  from = "/delete-account/*"
  to = "/delete-account.html"
  status = 200
