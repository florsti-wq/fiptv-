# fIPTV: eigener Weiterleiter (Resolver) für fIPTV Web – läuft kostenlos als Cloudflare Worker
# unter https://fiptv-resolver.<dein-name>.workers.dev. Bereitgestellt per GitHub Action
# (.github/workflows/fiptv-resolver.yml) mit den Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID.
name = "fiptv-resolver"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://fiptv-web.netlify.app,http://localhost:3000"
SOURCE_CACHE_TTL_SECONDS = "180"
ADDON_TIMEOUT_MS = "15000"
ADDON_EXTENDED_TIMEOUT_MS = "35000"
# Nur angemeldete fIPTV-Konten: /media verlangt ein Ticket, das der eigene Sync-Server signiert
STREAM_TICKET_MODE = "required"
STREAM_TICKET_KEYS_URL = "https://fipsite.netlify.app/.netlify/functions/stream-ticket-key"
